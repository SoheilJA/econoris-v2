<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>آموزش‌ها — اکونوریس</title>
  <meta name="description" content="آموزش‌ها اکونوریس؛ به‌زودی با محتوای تخصصی منتشر می‌شود.">
  <meta name="theme-color" content="#070B1F">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{ink:{900:'#050818',800:'#070B1F',700:'#0C1233',600:'#131A4A',500:'#1A2360'},blue:'#2F6BFF',violet:'#7C4DFF',teal:'#00D4C2',lime:'#B6F23A',coral:'#FF6B6B',amber:'#FFB938',magenta:'#FF4FA3'},fontFamily:{sans:['Vazirmatn','system-ui','sans-serif']}}}};</script>
  <link rel="stylesheet" href="../assets/css/custom.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://unpkg.com/lenis@1.0.43/dist/lenis.min.js"></script>
  <style>
    .orbit { animation: orbit 30s linear infinite; transform-origin: center; }
    @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .pulse-ring-large::after {
      content: ''; position: absolute; inset: -20px; border-radius: inherit;
      border: 1px solid #00D4C2; opacity: 0.4;
      animation: pulse-large 3s ease-out infinite;
    }
    @keyframes pulse-large {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(2); opacity: 0; }
    }
  </style>
</head>
<body class="bg-ink-800 text-white font-sans min-h-screen-svh relative overflow-hidden">
  <div data-host="preloader"></div>
  <div data-host="header"></div>

  <main id="main" class="relative min-h-screen-svh flex items-center justify-center overflow-hidden">
    <!-- Background -->
    <div class="absolute inset-0 bg-aurora bg-grain"></div>
    <div class="absolute inset-0 bg-dot-grid opacity-30"></div>
    <div class="absolute top-1/4 right-1/4 w-72 h-72 blob" style="background:#00D4C2;"></div>
    <div class="absolute bottom-1/4 left-1/4 w-64 h-64 blob" style="background:#B6F23A;"></div>

    <!-- Orbiting decoration -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none" aria-hidden="true">
      <div class="orbit relative w-[600px] h-[600px] max-w-[90vw] max-h-[90vw]">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-3 h-3 rounded-full" style="background:#00D4C2;box-shadow:0 0 20px #00D4C2;"></div>
        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-2 h-2 rounded-full" style="background:#B6F23A;box-shadow:0 0 15px #B6F23A;"></div>
        <div class="absolute top-1/2 right-0 -translate-y-1/2 w-2.5 h-2.5 rounded-full" style="background:white;opacity:0.6;"></div>
        <div class="absolute top-1/2 left-0 -translate-y-1/2 w-2 h-2 rounded-full" style="background:white;opacity:0.4;"></div>
        <div class="absolute top-[15%] left-[15%] w-2 h-2 rounded-full" style="background:#00D4C2;opacity:0.6;"></div>
        <div class="absolute bottom-[15%] right-[15%] w-2 h-2 rounded-full" style="background:#B6F23A;opacity:0.5;"></div>
      </div>
    </div>

    <!-- Content -->
    <div class="container-x relative z-10 text-center pt-[var(--header-h)]">
      <!-- Big pulse icon -->
      <div class="relative inline-block mb-8 reveal">
        <div class="pulse-ring-large relative w-24 h-24 rounded-full grid place-items-center"
             style="background:linear-gradient(135deg,#00D4C222,#B6F23A22);border:1.5px solid #00D4C2;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#00D4C2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v5l3 3"/>
          </svg>
        </div>
      </div>

      <!-- Latin sub-label -->
      <div class="text-xs opacity-50 tracking-widest mb-3 latn">Trainings</div>

      <!-- Title -->
      <h1 class="text-5xl md:text-7xl font-extrabold mb-4 reveal" data-hero-title>
        <span class="text-aurora">آموزش‌ها</span>
      </h1>

      <!-- Coming soon pill -->
      <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full glass mb-6 reveal">
        <span class="pulse-dot w-2 h-2 rounded-full" style="background:#00D4C2;"></span>
        <span class="text-sm font-bold">به‌زودی</span>
      </div>

      <!-- Subtitle -->
      <p class="text-base md:text-lg text-white/70 max-w-xl mx-auto leading-relaxed mb-8 reveal">
        این بخش در دست آماده‌سازی است. به‌زودی با محتوای تخصصی منتشر می‌شود.
      </p>

      <!-- CTA -->
      <a href="../index.html" class="btn btn-primary magnetic reveal" data-magnetic>
        بازگشت به خانه
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>

      <!-- Phone CTA -->
      <div class="mt-12 reveal">
        <p class="text-xs opacity-60 mb-2">برای مشاوره رایگان تماس بگیرید:</p>
        <a href="tel:09192639746" class="inline-flex items-center gap-2 text-lg font-extrabold" dir="ltr">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="text-[var(--c-teal)]"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L20 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z" transform="translate(-3 0)"/></svg>
          ۰۹۱۹-۲۶۳-۹۷۴۶
        </a>
      </div>
    </div>
  </main>

  <div data-host="footer"></div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/content.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/preloader.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/animations.js"></script>
  <script src="../assets/js/page-coming-soon.js"></script>
</body>
</html>
