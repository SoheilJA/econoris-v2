<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>فضای کار اشتراکی — اکونوریس</title>
  <meta name="description" content="فضای کار اشتراکی اکونوریس؛ بستر تعامل، تبادل دانش و هم‌افزایی هدفمند میان تیم‌های استارتاپی.">
  <meta name="theme-color" content="#070B1F">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{ink:{900:'#050818',800:'#070B1F',700:'#0C1233',600:'#131A4A',500:'#1A2360'},blue:'#2F6BFF',violet:'#7C4DFF',teal:'#00D4C2',lime:'#B6F23A',coral:'#FF6B6B',amber:'#FFB938',magenta:'#FF4FA3'},fontFamily:{sans:['Vazirmatn','system-ui','sans-serif']}}}};</script>
  <link rel="stylesheet" href="../assets/css/custom.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.0.42/dist/lenis.min.js"></script>
</head>
<body class="bg-ink-800 text-white font-sans accent-violet">
  <div data-host="preloader"></div>
  <div data-host="header"></div>

  <main id="main">
    <div class="pt-[calc(var(--header-h)+1.5rem)] container-x">
      <nav class="text-xs opacity-60 flex items-center gap-2"><a href="../index.html" class="hover:opacity-100">خانه</a><span>/</span><span class="opacity-80">فضای کار اشتراکی</span></nav>
    </div>

    <!-- HERO with isometric campus map -->
    <section class="relative py-20 md:py-28 overflow-hidden bg-aurora bg-grain">
      <div class="absolute inset-0 bg-grain opacity-30"></div>
      <div class="container-x relative text-center">
        <div class="inline-block px-3 py-1 rounded-full text-xs font-bold tracking-widest mb-4 reveal glass" style="color:var(--violet);">
          <span class="pulse-dot inline-block w-2 h-2 rounded-full me-2" style="background:var(--c-violet);"></span>دسته خدمات
        </div>
        <h1 class="text-4xl md:text-6xl font-extrabold mb-6 reveal" data-hero-title>
          <span class="block">فضای کار</span>
          <span class="block text-aurora">اشتراکی</span>
        </h1>
        <p class="text-lg text-white/80 max-w-2xl mx-auto leading-relaxed reveal">بستر تعامل، تبادل دانش و هم‌افزایی هدفمند میان تیم‌های استارتاپی برای شتاب‌بخشی به رشد در فضایی تخصصی.</p>
      </div>

      <!-- Isometric campus SVG -->
      <div class="container-x mt-12 relative">
        <svg viewBox="0 0 1200 600" class="w-full max-w-5xl mx-auto" id="campusSVG">
          <defs>
            <linearGradient id="zoneGrad-violet" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7C4DFF" stop-opacity="0.6"/><stop offset="100%" stop-color="#7C4DFF" stop-opacity="0.1"/></linearGradient>
            <linearGradient id="zoneGrad-teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#00D4C2" stop-opacity="0.6"/><stop offset="100%" stop-color="#00D4C2" stop-opacity="0.1"/></linearGradient>
            <linearGradient id="zoneGrad-coral" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FF6B6B" stop-opacity="0.6"/><stop offset="100%" stop-color="#FF6B6B" stop-opacity="0.1"/></linearGradient>
            <linearGradient id="zoneGrad-amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFB938" stop-opacity="0.6"/><stop offset="100%" stop-color="#FFB938" stop-opacity="0.1"/></linearGradient>
            <linearGradient id="zoneGrad-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2F6BFF" stop-opacity="0.6"/><stop offset="100%" stop-color="#2F6BFF" stop-opacity="0.1"/></linearGradient>
            <linearGradient id="zoneGrad-magenta" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FF4FA3" stop-opacity="0.6"/><stop offset="100%" stop-color="#FF4FA3" stop-opacity="0.1"/></linearGradient>
          </defs>
          <!-- Isometric grid -->
          <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
            <!-- Diamond grid -->
            <path d="M0,300 L600,0 L1200,300 L600,600 Z"/>
            <path d="M200,200 L800,200 M200,400 L800,400"/>
            <path d="M400,100 L400,500"/>
            <path d="M300,150 L300,450 M500,150 L500,450 M700,150 L700,450"/>
          </g>
          <!-- Zones (isometric shapes) - hover highlights -->
          <g id="campusZones">
            <!-- Each zone is an isometric "block" with a label -->
            <a href="research-desk.html"><g class="campus-zone" data-zone="0" transform="translate(300, 200)">
              <path d="M0,40 L80,0 L160,40 L80,80 Z" fill="url(#zoneGrad-violet)" stroke="#7C4DFF" stroke-width="1.5" class="zone-shape"/>
              <path d="M0,40 L0,90 L80,130 L80,80 Z" fill="#7C4DFF" opacity="0.15"/>
              <path d="M160,40 L160,90 L80,130 L80,80 Z" fill="#7C4DFF" opacity="0.3"/>
              <text x="80" y="60" text-anchor="middle" fill="white" font-size="12" font-weight="800">میز پژوهشی</text>
            </g></a>
            <a href="private-research-room.html"><g class="campus-zone" data-zone="1" transform="translate(700, 200)">
              <path d="M0,40 L80,0 L160,40 L80,80 Z" fill="url(#zoneGrad-magenta)" stroke="#FF4FA3" stroke-width="1.5" class="zone-shape"/>
              <path d="M0,40 L0,90 L80,130 L80,80 Z" fill="#FF4FA3" opacity="0.15"/>
              <path d="M160,40 L160,90 L80,130 L80,80 Z" fill="#FF4FA3" opacity="0.3"/>
              <text x="80" y="60" text-anchor="middle" fill="white" font-size="11" font-weight="800">اتاق پژوهشی</text>
            </g></a>
            <a href="laboratory.html"><g class="campus-zone" data-zone="2" transform="translate(500, 100)">
              <path d="M0,40 L80,0 L160,40 L80,80 Z" fill="url(#zoneGrad-teal)" stroke="#00D4C2" stroke-width="1.5" class="zone-shape"/>
              <path d="M0,40 L0,90 L80,130 L80,80 Z" fill="#00D4C2" opacity="0.15"/>
              <path d="M160,40 L160,90 L80,130 L80,80 Z" fill="#00D4C2" opacity="0.3"/>
              <text x="80" y="60" text-anchor="middle" fill="white" font-size="12" font-weight="800">آزمایشگاه</text>
            </g></a>
            <a href="high-speed-internet.html"><g class="campus-zone" data-zone="3" transform="translate(100, 350)">
              <path d="M0,40 L80,0 L160,40 L80,80 Z" fill="url(#zoneGrad-blue)" stroke="#2F6BFF" stroke-width="1.5" class="zone-shape"/>
              <path d="M0,40 L0,90 L80,130 L80,80 Z" fill="#2F6BFF" opacity="0.15"/>
              <path d="M160,40 L160,90 L80,130 L80,80 Z" fill="#2F6BFF" opacity="0.3"/>
              <text x="80" y="60" text-anchor="middle" fill="white" font-size="10" font-weight="800">اینترنت</text>
            </g></a>
            <a href="legal-consulting.html"><g class="campus-zone" data-zone="4" transform="translate(500, 350)">
              <path d="M0,40 L80,0 L160,40 L80,80 Z" fill="url(#zoneGrad-amber)" stroke="#FFB938" stroke-width="1.5" class="zone-shape"/>
              <path d="M0,40 L0,90 L80,130 L80,80 Z" fill="#FFB938" opacity="0.15"/>
              <path d="M160,40 L160,90 L80,130 L80,80 Z" fill="#FFB938" opacity="0.3"/>
              <text x="80" y="60" text-anchor="middle" fill="white" font-size="11" font-weight="800">حقوقی</text>
            </g></a>
            <a href="information-resources.html"><g class="campus-zone" data-zone="5" transform="translate(900, 350)">
              <path d="M0,40 L80,0 L160,40 L80,80 Z" fill="url(#zoneGrad-coral)" stroke="#FF6B6B" stroke-width="1.5" class="zone-shape"/>
              <path d="M0,40 L0,90 L80,130 L80,80 Z" fill="#FF6B6B" opacity="0.15"/>
              <path d="M160,40 L160,90 L80,130 L80,80 Z" fill="#FF6B6B" opacity="0.3"/>
              <text x="80" y="60" text-anchor="middle" fill="white" font-size="10" font-weight="800">منابع</text>
            </g></a>
          </g>
        </svg>
      </div>
    </section>

    <!-- Service list -->
    <section class="relative py-20 md:py-28 bg-ink-900 overflow-hidden">
      <div class="absolute inset-0 bg-dot-grid opacity-30"></div>
      <div class="container-x relative">
        <div class="text-center max-w-2xl mx-auto mb-12">
          <h2 class="text-3xl md:text-5xl font-extrabold mb-4 reveal">سرویس‌های فضای کار اشتراکی</h2>
        </div>
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4" id="servicesList"></div>
      </div>
    </section>

    <!-- CTA -->
    <section class="relative py-16 overflow-hidden" style="background:var(--grad-consult);">
      <div class="absolute inset-0 bg-grain"></div>
      <div class="container-x relative text-center">
        <h2 class="text-2xl md:text-4xl font-extrabold mb-4 reveal">از متخصصین ما مشاوره رایگان دریافت کنید</h2>
        <a href="tel:09192639746" class="inline-block text-2xl md:text-4xl font-extrabold mb-6" dir="ltr">۰۹۱۹-۲۶۳-۹۷۴۶</a>
        <div><a href="../contact.html" class="btn bg-white text-ink-800" style="color:var(--c-ink-800);font-weight:800;">تماس با پشتیبانی</a></div>
      </div>
    </section>
  </main>

  <div data-host="footer"></div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/content.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/preloader.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/animations.js"></script>
  <script src="../assets/js/page-shared-workspace.js"></script>
</body>
</html>
